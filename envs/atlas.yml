# Streaming per-donor gene-set and cytokine-programme scores from the atlas h5ad (pipeline `atlas`).
name: hhca-atlas
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.16.3
  - pandas=2.2.2
  - h5py=3.15.1
  - statsmodels=0.14.5
  - anndata=0.12.16
  - pyyaml=6.0.3
