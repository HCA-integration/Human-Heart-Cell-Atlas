# CellPin label transfer (pipeline `xenium`). cellpin is pinned by commit (public repo Saur-Lab/cellpin,
# 0.1.1 @ 48b97bc). torch is the CPU wheel: CellPin trains on the ~40k-cell reference only.
name: hhca-xenium-cellpin
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch @ https://download.pytorch.org/whl/cpu/torch-2.11.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl
      - pytorch-lightning==2.6.5
      - torchmetrics==1.9.0
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==2.3.3
      - pyarrow==24.0.0
      - h5py==3.16.0
      - anndata==0.12.16
      - scanpy==1.11.5
      - scikit-learn==1.8.0
      - numba==0.65.1
      - pynndescent==0.6.0
      - umap-learn==0.5.12
      - igraph==1.0.0
      - leidenalg==0.11.0
      - session-info2==0.4.1
      - psutil==7.2.2
      - pyyaml==6.0.3
      - rich==15.0.0
      - tensorboard==2.20.0
      - cellpin @ https://github.com/Saur-Lab/cellpin/archive/48b97bc394c7b8b672e51c5455aca7ed4e4fec8d.tar.gz
