# CMFLAG (Visium HD spillover flags) and the CMFLAG-clean h5ad builder; every package from conda-forge.
# aicspylibczi 3.3.1 reads the CZI H&E images of the AH10 sections.
name: hhca-substrate-cmflag
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.20
  - numpy=2.2.6
  - scipy=1.15.2
  - pandas=2.3.3
  - pyarrow=22.0.0
  - scikit-image=0.25.2
  - scikit-learn=1.7.2
  - tifffile=2025.5.10
  - imagecodecs=2025.3.30
  - pillow=12.0.0
  - libopencv=4.12.0=headless*
  - py-opencv=4.12.0=headless*
  - h5py=3.16.0=nompi*
  - anndata=0.11.4
  - scanpy=1.11.5
  - numba=0.65.1
  - matplotlib-base=3.10.9
  - aicspylibczi=3.3.1
  - pyyaml
