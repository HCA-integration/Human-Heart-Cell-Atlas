# CPU Python steps of the deconvolution benchmark: build_reference.py, prep_inputs.py, make_gene_panel.py,
# marker_scores.py, UCASpatial (run_ucaspatial.py + ucaspatial.py), and the ground-truth simulation
# builder (build_sim.py). Python 3.12.9, every package pinned.
name: hhca-deconv-cpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.9
  - pip
