# In-house NNLS (run_atlas_deconv.py) and the downstream tables (compare_methods.py,
# build_endo_LV_composition.py, build_cmdominant_panel.py, build_ED8c.py): python 3.11.7, numpy 1.26.3,
# scipy 1.11.4 (scipy's NNLS changed implementation in 1.12, so the pin matters), scanpy 1.9.8,
# anndata 0.10.5.post1; conda-forge builds.
name: hhca-deconv-nnls
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.7
  - numpy=1.26.3
  - scipy=1.11.4
  - pandas=2.1.4
  - anndata=0.10.5.post1
  - scanpy=1.9.8
  - h5py=3.9.0
  - matplotlib-base=3.8.0
  - scikit-learn=1.2.2
  - statsmodels=0.14.0
  - numba=0.58.1
  - llvmlite=0.41.1          # numba 0.58.1 accepts 0.41.*
  - umap-learn=0.5.3
  - pynndescent=0.5.10
  - natsort=7.1.1
  - seaborn=0.13.2
  - session-info=1.0.0
  - networkx=3.1
