# Notebooks in notebooks/: a walk through each analysis.
name: hhca-notebooks
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=2.3.3
  - pyarrow=24.0.0
  - statsmodels=0.14.6
  - scanpy=1.11.5
  - anndata=0.12.16
  - h5py=3.16.0=nompi*
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - tifffile=2026.3.3
  - pillow=13.0.0
  - scikit-image=0.26.0
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - squidpy=1.8.2
  - scikit-learn=1.8.0
  - ipykernel=7.4.0
  - nbconvert=7.17.2
  - jupyterlab=4.6.6
  - setuptools=81.0.0        # drug2cell 0.1.2 imports pkg_resources
  - pip
  - pip:
      - blitzgsea==1.3.54
      - drug2cell==0.1.2
