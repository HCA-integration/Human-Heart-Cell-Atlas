        scanvi_custom_hvgs: ./pipeline/benchmark_manual_hvgs/integration/dataset~benchmark_manual_hvgs/file_id~benchmark_manual_hvgs/batch~donor_id/var_mask~highly_variable/method~scanvi--hyperparams~8a3acca17f--label~Final Level 4_harmonized--output_type~embed.zarr
        scpoli_custom_hvgs_celltype: ./pipeline/benchmark_manual_hvgs/integration/dataset~benchmark_manual_hvgs/file_id~benchmark_manual_hvgs/batch~donor_id/var_mask~highly_variable/method~scpoli--hyperparams~8f257240c1--label~Final Level 4_harmonized--output_type~embed.zarr
        scpoli_custom_hvgs_no_celltype: ./pipeline/benchmark_manual_hvgs/integration/dataset~benchmark_manual_hvgs/file_id~benchmark_manual_hvgs/batch~donor_id/var_mask~highly_variable/method~scpoli--hyperparams~0e6dc5f683--label~None--output_type~embed.zarr
        scvi_custom_hvgs: ./pipeline/benchmark_manual_hvgs/integration/dataset~benchmark_manual_hvgs/file_id~benchmark_manual_hvgs/batch~donor_id/var_mask~highly_variable/method~scvi--hyperparams~f1ddeb565f--label~None--output_type~embed.zarr
      metrics: clustering
 

    clustering:
      algorithm: leiden
      recompute_neighbors: true
      recompute_umap: true
      neighbors:
        use_rep: X_emb
        n_neighbors: 50
      use_gpu: true
      resolutions:
        - 0.4
      umap_colors:
        - donor_id
        - "Final Level 4_harmonized"
        - "Final Level 3_harmonized"
        - "Final Level 2_harmonized"
        - "Final Level 1_harmonized"
        
       
    # module configuration
    metrics:
      output_type: embed
      raw_counts: layers/counts
      use_gpu: true
      gene_sets:
        Atrial Cardiomyocytes:
          - NPPA
          - MYL7
          - MYL4

        Ventricular Cardiomyocytes:
          - MYH7
          - MYL2
          - FHL2

        Fibroblasts:
          - DCN
          - PDGFRA

        Arterial Endothelial Cells:
          - DKK2
          - GJA5
          - SEMA3G

        Capillary Endothelial Cells:
          - RGCC
          - CA4
          - GPIHBP1

        Venous Endothelial Cells:
          - ACKR1
          - POSTN
          - PLVAP

        Lymphatic Endothelial Cells:
          - PROX1
          - LYVE1
          - PDPN

        Endocardial Endothelial Cells:
          - SMOC1
          - NPR3

        Pericytes:
          - KCNJ8
          - ABCC9
          - RGS5

        Vascular Smooth Muscle cells:
          - MYH11
          - ACTA2
          - TAGLN

        Macrophages:
          - CD163
          - C1QA

        Monocytes:
          - FCN1
          - VCAN

        Dendritic cells:
          - FLT3
          - CLEC9A
          - CLEC10A

        T cells:
          - CD3E
          - IL7R

        NK cells:
          - NKG7
          - KLRD1

        B cells:
          - MS4A1
          - CD79B

        Plasma cells:
          - XBP1
          - SDC1

        Mast:
          - KIT
          - IL18R1
          - CPA3

        Adipocytes:
          - GPAM
          - ADIPOQ
          - FASN

        Neural:
          - NRXN1
          - NRXN3
          - CDH19

        Epicardium:
          - WT1
          - MSLN
          - ITLN1
                
      var_mask: highly_variable
      batch: 
        - donor_id
      label: Final Level 3_harmonized
      covariates:
        - "Final Level 4_harmonized"
        - "Final Level 3_harmonized"
        - "Final Level 2_harmonized"
        - "Final Level 1_harmonized"
      overwrite_file_id: true
      metrics:

        - bras_batch
        - ilisi
        - kbet_y

        - morans_i_genescore
        - morans_i
        - nmi
        - ari